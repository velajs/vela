name: Publish

# Publishes the CURRENT package.json version to npm on demand. The auto-release
# (release.yml) only fires on new commits; this lets an already-bumped+tagged
# version that missed publication (e.g. a failed trusted-publisher run)
# be published without a synthetic bump. `npm publish` no-ops loudly if the
# version already exists.
on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: npm install -g npm@12.0.0

      - name: Validate release lock integrity
        run: node scripts/check-release-lock.mjs

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:preflight

      - run: pnpm release:check

      - run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
