name: Publish

# Publishes the CURRENT package.json version to npm on demand. The auto-release
# (release.yml) only fires on new commits; this lets an already-bumped+tagged
# version that missed publication (e.g. a run before NPM_TOKEN was configured)
# be published without a synthetic bump. `npm publish` no-ops loudly if the
# version already exists.
on:
  workflow_dispatch: {}
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install
      - run: pnpm run build
      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=\${NODE_AUTH_TOKEN}" > ~/.npmrc
          echo "token present: ${NODE_AUTH_TOKEN:+yes} (len ${#NODE_AUTH_TOKEN})"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
