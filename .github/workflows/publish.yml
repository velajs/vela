name: Publish

permissions:
  contents: read

# Workspace publisher: publishes every non-private package whose version is
# not yet on npm (pnpm -r publish skips already-published versions). Bump the
# package versions in a normal commit, then dispatch this workflow.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@12.0.0

      - name: Validate release lock integrity
        run: node scripts/check-release-lock.mjs

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:preflight

      - run: pnpm release:check

      - name: Publish to npm
        run: pnpm -r publish --no-git-checks --access public
        env:
          NPM_CONFIG_PROVENANCE: "true"
