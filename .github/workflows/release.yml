name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: 'Original completed release run whose exact artifacts should be resumed'
        type: string
        default: ''
      metadata_only:
        description: 'Reconcile historical tags/releases without publishing or changing npm latest'
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      # No registry-url: a generated _authToken entry would interfere with OIDC.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.0
      - run: pnpm install --frozen-lockfile
        if: ${{ !inputs.recovery_run_id }}
      - run: pnpm verify
        if: ${{ !inputs.recovery_run_id }}
      - run: pnpm peers check
        if: ${{ !inputs.recovery_run_id }}
      - run: pnpm audit --audit-level=high
        if: ${{ !inputs.recovery_run_id }}
      - name: Create release PR or publish tested archives through OIDC
        if: ${{ !inputs.recovery_run_id }}
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          commit-message: 'chore: prepare package releases'
          pr-title: 'chore: release packages'
          publish-script: node scripts/release-ci.mjs
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Require signed provenance from this public repository for every upload.
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Resume verified release artifacts without rebuilding
        if: ${{ inputs.recovery_run_id }}
        run: node scripts/release-resume.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_METADATA_ONLY: ${{ inputs.metadata_only }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.recovery_run_id && format('recovered-release-{0}-{1}', inputs.recovery_run_id, github.run_id) || format('release-{0}', github.sha) }}
          path: .artifacts/release/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
