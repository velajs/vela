name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: 'Original completed release run whose exact artifacts should be resumed'
        type: string
        default: ''
      metadata_only:
        description: 'Reconcile historical tags/releases without publishing or changing npm latest'
        type: boolean
        default: false

permissions:
  actions: read
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No registry-url: a generated _authToken entry would interfere with OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.0
      - run: pnpm install --frozen-lockfile
        if: ${{ !inputs.recovery_run_id }}
      - run: pnpm verify
        if: ${{ !inputs.recovery_run_id }}
      - run: pnpm peers check
        if: ${{ !inputs.recovery_run_id }}
      - run: pnpm audit --audit-level=high
        if: ${{ !inputs.recovery_run_id }}
      - name: Create release PR or publish tested archives through OIDC
        if: ${{ !inputs.recovery_run_id }}
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          commit-message: 'chore: prepare package releases'
          pr-title: 'chore: release packages'
          publish-script: node scripts/release-ci.mjs
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Require signed provenance from this public repository for every upload.
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Resume verified release artifacts without rebuilding
        if: ${{ inputs.recovery_run_id }}
        run: node scripts/release-resume.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_METADATA_ONLY: ${{ inputs.metadata_only }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ inputs.recovery_run_id && format('recovered-release-{0}-{1}', inputs.recovery_run_id, github.run_id) || format('release-{0}', github.sha) }}
          path: .artifacts/release/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
