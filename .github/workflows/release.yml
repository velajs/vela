name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No registry-url: a generated _authToken entry would interfere with OIDC.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm peers check
      - run: pnpm audit --audit-level=high
      - name: Check for unversioned changesets
        id: versions
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const pending = fs.readdirSync(".changeset").filter(name => name.endsWith(".md") && name !== "README.md"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "ready=" + (pending.length === 0) + "\n");'
      - name: Explain pending version preparation
        if: steps.versions.outputs.ready != 'true'
        run: echo 'Run pnpm version-packages and merge the resulting version changes to publish. Organization policy disables bot-created release PRs.'
      - name: Publish tested archives through OIDC
        if: steps.versions.outputs.ready == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          publish-script: node scripts/release-ci.mjs
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm provenance is not supported for private source repositories.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.private == false }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-${{ github.sha }}
          path: .modernization/release-artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
