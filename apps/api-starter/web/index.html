<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vela · Shared board</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui; --line: #80808050 }
    body { max-width: 760px; margin: 5vh auto; padding: 24px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px }
    h1 { margin-bottom: 4px; font-size: 2rem } p { color: #888; margin-top: 0 }
    form { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 }
    input, button { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px }
    input { min-width: 130px; flex: 1 } button { cursor: pointer }
    button:hover { border-color: #816cff } [hidden] { display: none !important }
    ul { padding: 0; list-style: none } li { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line) }
    li input { min-width: auto; flex: none } li span { flex: 1 } .done { text-decoration: line-through; opacity: .6 }
    #error { color: #df635b; white-space: pre-wrap } #status { font-size: .85rem; color: #888 } footer { margin-top: 32px; font-size: .85rem; color: #888 }
  </style>
</head>
<body>
  <header><div><h1>Shared board</h1><p>A small, complete Vela app.</p></div><span id="status">Signed out</span></header>
  <section id="auth">
    <form id="auth-form">
      <input id="name" aria-label="Name for new account" placeholder="Name" autocomplete="name">
      <input id="email" aria-label="Email" placeholder="Email" type="email" autocomplete="email" required>
      <input id="password" aria-label="Password" placeholder="Password (8+ characters)" type="password" autocomplete="current-password" minlength="8" required>
      <button type="submit" name="mode" value="sign-in">Sign in</button>
      <button type="submit" name="mode" value="sign-up">Create account</button>
    </form>
  </section>
  <section id="board" hidden>
    <header><span id="user"></span><button id="sign-out">Sign out</button></header>
    <form id="add-form"><input id="title" aria-label="New task" placeholder="What needs doing?" maxlength="200" required><button>Add task</button></form>
    <ul id="todos"></ul><p id="presence"></p>
  </section>
  <div id="error" role="alert"></div>
  <footer>All signed-in users share this board. Open another tab to see live updates. Inspect it with Vela Studio from your terminal.</footer>
  <script type="module" src="/main.js"></script>
</body>
</html>
