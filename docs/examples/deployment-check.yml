# Opt-in example for a CONSUMING APPLICATION. This file is not an active workflow.
# The deploy check builds the application with the Wrangler vars only to read its entrypoints.
name: Check staging deployment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec vela cf sync --env staging
      - run: pnpm exec vela deploy check --env staging --json
      # Vite builds the staging Worker, decorator metadata included, and leaves the
      # redirect that `wrangler deploy` follows; `--config` would bypass it.
      - run: CLOUDFLARE_ENV=staging pnpm build
      # Wrangler bundling is separate; no actual upload or Cloudflare credentials.
      # `--env` must name the environment the build targeted.
      - run: pnpm exec wrangler deploy --env staging --dry-run
