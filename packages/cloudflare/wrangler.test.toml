# Test-only configuration. This suite intentionally runs without nodejs_compat
# so the primary Worker/Durable Object security boundary is exercised by the
# real workerd WebSocket and hibernation APIs.
name = "vela-cloudflare-security-test"
main = "src/__tests__/workers/entry.ts"
compatibility_date = "2026-07-01"

[[durable_objects.bindings]]
name = "TEST_ROOM"
class_name = "TestRoom"

[[durable_objects.bindings]]
name = "COUNTING_ROOM"
class_name = "CountingRoom"

[[durable_objects.bindings]]
name = "CRON_ROOM"
class_name = "CronRoom"

[[durable_objects.bindings]]
name = "SQLITE_LIVE_ROOM"
class_name = "SqliteLiveRoom"

[[durable_objects.bindings]]
name = "KV_LIVE_ROOM"
class_name = "KvLiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TestRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CountingRoom"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CronRoom"]

# A class without SQLite storage: live queries keep an in-memory cursor log.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["SqliteLiveRoom"]
new_classes = ["KvLiveRoom"]

# Vela Durable Object hosts: the application context booted per instance.
[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[durable_objects.bindings]]
name = "BROKEN_COUNTER"
class_name = "BrokenCounter"

[[migrations]]
tag = "v5"
new_sqlite_classes = ["Counter", "BrokenCounter"]

# A Vela Workflow: each run executes in the Worker's application.
[[workflows]]
name = "vela-signups"
binding = "SIGNUP_WORKFLOW"
class_name = "SignupWorkflow"

# A Vela Workflow that sleeps between steps, so an instance can be paused mid-run.
[[workflows]]
name = "vela-naps"
binding = "NAP_WORKFLOW"
class_name = "NapWorkflow"

[[workflows]]
name = "vela-portable-example"
binding = "PORTABLE_WORKFLOW"
class_name = "PortableExampleWorkflow"

[[workflows]]
name = "vela-portable-agent"
binding = "PORTABLE_AGENT_WORKFLOW"
class_name = "PortableAgentWorkflow"

[[services]]
binding = "PORTABLE_PROBE"
service = "vela-cloudflare-security-test"
entrypoint = "PortableProbe"

# A Vela service entrypoint, bound to this Worker with the props its calls carry.
[[services]]
binding = "BILLING"
service = "vela-cloudflare-security-test"
entrypoint = "Billing"
props = { tenant = "acme" }

[[kv_namespaces]]
binding = "CACHE"
id = "test-cache"

[[d1_databases]]
binding = "DB"
database_name = "test-db"
database_id = "00000000-0000-0000-0000-000000000001"

[[r2_buckets]]
binding = "FILES"
bucket_name = "test-files"

[[queues.producers]]
binding = "QUEUE_BRIDGE"
queue = "vela-queue-bridge-test"

# Plain variables the runtime seeds into ENV (see workers/env-runtime.test.ts).
[vars]
ENV_PROBE = "workerd-env"
# Read through DI by the gateway's origin allowlist and upgrade authenticator.
WS_ALLOWED_ORIGIN = "https://app.test"
WS_TENANT = "tenant-1"
URL_SIGNING_SECRET = "workerd-signing-secret"
