packages:
  - '.'

# WP-A dev/test resolution for unpublished local packages (documented in
# batch-5 spec DEP WIRING): @velajs/workflow and @velajs/mail are not on npm and
# @velajs/vela's local main is ahead of npm (carries the unpublished ctx.run
# seam). All three are resolved to their local repos via absolute `link:`
# overrides so a fresh worktree (which has no relative node_modules symlink)
# resolves them location-independently. @velajs/mail is consumed by the Email
# Workers adapter (batch 7): its outbound transport + the email() host hook's
# inbound dispatcher. Remove these once the versions publish.
overrides:
  '@velajs/vela': 'link:/Users/kauan/Projects/velajs/vela'
  '@velajs/workflow': 'link:/Users/kauan/Projects/velajs/workflow'
  '@velajs/mail': 'link:/Users/kauan/Projects/velajs/mail'
  # Dedupe hono onto the SAME physical copy the linked vela uses. Without this,
  # the worktree installs its own hono and the linked vela keeps its bundled one,
  # so `VelaApplication`'s Hono-typed surface (getHonoApp / middleware) reads as
  # two incompatible types (the `[GET_MATCH_RESULT]` symbol mismatch) — a
  # pre-existing dev-link artifact that also reddens the base checkout's
  # typecheck. In real installs @velajs/vela is a normal dep and hono dedupes on
  # its own; this override only reproduces that here.
  'hono': 'link:/Users/kauan/Projects/velajs/vela/node_modules/hono'

allowBuilds:
  '@swc/core': true
  esbuild: true
  workerd: true

catalog:
  typescript: ^7.0.2
  tsdown: ^0.22.4
  vitest: ^4.1.10
  oxlint: ^1.73.0
  oxfmt: ^0.58.0
  publint: ^0.3.21
  '@arethetypeswrong/cli': ^0.18.5
  '@changesets/cli': ^2.31.0
  '@swc/core': ^1.15.43
  unplugin-swc: ^1.5.9
  '@types/node': ^24.13.3

minimumReleaseAgeExclude:
  - '@arethetypeswrong/cli@0.18.5'
  - '@arethetypeswrong/core@0.18.5'
  - '@velajs/errors@1.0.0'
  - '@velajs/vela@1.19.0'
  - '@velajs/live-protocol@1.0.0'
  - '@velajs/feature-flags@0.1.0'
  - '@velajs/testing@0.5.0'
  - 'es-module-lexer@2.3.1'
  - 'nanoid@3.3.16'

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - workerd
