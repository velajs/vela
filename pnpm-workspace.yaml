packages:
  - packages/*
  - apps/*

catalog:
  typescript: 7.0.2
  tsdown: 0.23.4
  vite: 8.3.5
  vitest: 4.1.11
  oxlint: 1.90.0
  oxfmt: 0.75.0
  publint: 0.3.25
  "@arethetypeswrong/cli": 0.18.5
  "@changesets/cli": 3.0.3
  "@swc/core": 1.16.20
  unplugin-swc: 1.5.9
  "@types/node": 24.13.3
  "@types/json-schema": 7.0.15
  "@vitest/runner": 4.1.11
  "@vitest/snapshot": 4.1.11
  hono: 4.13.14
  zod: 4.6.7
  valibot: 1.5.0
  ai: 7.0.156
  "@cfworker/json-schema": 4.1.1
  "@cloudflare/vite-plugin": 1.66.0
  "@cloudflare/vitest-plugin": 1.4.10
  "@cloudflare/workers-types": 5.20261029.1
  wrangler: 4.155.0

allowBuilds:
  "@swc/core": true
  "@parcel/watcher": true
