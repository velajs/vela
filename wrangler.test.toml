# Test-only configuration. This suite intentionally runs without nodejs_compat
# so the primary Worker/Durable Object security boundary is exercised by the
# real workerd WebSocket and hibernation APIs.
name = "vela-cloudflare-security-test"
main = "src/__tests__/workers/entry.ts"
compatibility_date = "2026-07-01"

[[durable_objects.bindings]]
name = "TEST_ROOM"
class_name = "TestRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TestRoom"]
